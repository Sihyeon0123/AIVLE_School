		<title>Page Title</title>
        <!--style 을 여기에 명시 한다.-->
        <style>
            div{
                text-align: center;
                width: 300px;
                height: 300px;
            }

            /*교안의 예시 화면 처럼 나타날 수 있도록 opacity 와 z-index 속성을 추가해 보자*/
            #div1{                
                position: relative;
                top: 50px;
                border: 3px dashed green;
                background-color: yellowgreen;
            }
            #div2{   
                position: absolute;
                top: 10px;
                left: 20px;                
                border: 3px dashed red;
                background-color: orange;
            }
            #div3 {
                position: absolute;
                top: 100px;
                left: 250px;
                border: 2px dashed hotpink;
                background-color: pink;
            }
        </style>
