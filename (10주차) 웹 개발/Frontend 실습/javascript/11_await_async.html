<html>
    <head>
        <meta charset="UTF-8">
        <title>ECMA SCRIPT</title>
    </head>
    <body>
        <h3>*Promise</h3>
        <p>비동기 프로그래밍에서 발생할 수 있는 문제점과 콜백에 재해서 알아보았다.</p>
        <p>그리고 콜백의 문제점에 대해서도 확인해 보았다.</p>
        <p>이제는 이 콜백 지옥을 탈출할 방법인 Promise 와</p>
        <p>Promise 를 보다 더 쉽게 사용할 수 있는 async & await 에 대해 알아보자</p>
    </body>
    <script>
        //콜백 지옥을 벗어나기 위해 Promise 를 사용 해 보자        
        function plus(a,b){
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    //console.log('plus',a,b);
                    resolve(a+b);//resolve:성공시 호출 콜백, reject:실패시 호출 콜백
                },100);
            });
        }
        
        function multi(a,b){
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    //console.log('multi',a,b);
                    resolve(a*b);
                },100);
            });
        }

        function divide(a,b){
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    //console.log('divide',a,b);
                    resolve(a/b);
                },100);
            });
        }  

    //console.log(plus(10,20));//이 경우 Promise 객체가 반환 된다
    
    //[[PromiseState]]: "fulfilled" <- 상태:완료
    //[[PromiseResult]]: 30 <- 결과값
    
    //이 값을 꺼내긴 위해서는 then() 이라는 메서드를 사용 해야 한다.
    //plus(10,20).then((result)=>{console.log(result);});
    
    /*그리고 catch() 와 finally() 를 사용 할 수 있다.
    plus(10,20).then(result => console.log('plus(10,20):',result))
    .catch(error => console.error(error))
    .finally(console.log('에러던지 아니던지 수행'));
    */

    /* 
    plus(20,30)//50의 값으로 plus() 실행
    .then(r1=>multi(r1,2))//반환 값을 받아 multi() 실행
    .then(r2=>divide(r2,2))
    .then((result)=>{//최종 결과 값을 반환받아 출력
        console.log('((50+10)*2)/3=',result);
    });
    */

    //이렇게 Promise 로 받은 내용은 then() 을 통해서 한번 더 처리 하는것이 번거롭다.
    //하지만 async와 await 문법을 사용하면 좀 더 편리하게 처리 가능 하다.
    async function getResult(){
        let result = await plus(20,30);//await 은 async 함수안에서만 사용 가능 하다.
        console.log('async result : ',result);
        result = await multi(result,4);
        console.log('async result : ',result);
        result = await divide(result,2);
        console.log('async result : ',result);
    }
    getResult();	
    
    </script>
</html>
