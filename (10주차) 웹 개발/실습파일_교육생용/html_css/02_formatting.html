<html>
	<head>
		<meta charset="utf-8">
		<title>Page Title</title>
</head>    
	<body>
        <!--아래에 적합한 태그를 넣어보자-->
        <p>우리가 배우는 과목은 <abbr title="Hyper Text Markup Language"> HTML</abbr> 입니다.</p>
        <p><b>HTML</b> 은 웹에서 화면을 표시 해 줍니다.</p>
        <p>특정 단어에 <del>취소선</del>, <ins>밑줄</ins>을 그어줄 수 있다.</p>
        <p>또한 특정 단어에 대해 <i>이탤릭 체</i> 또는 <mark>마크</mark> 를 해 줄 수 있다.</p>
        <p>쿼터 표현 또한 태그로 가능 하다. "그냥 하는 방법", <q>를 사용하는 방법</q></p>
        <p>아래 첨자(X<sub>2</sub>)와 위 첨자(X<sup>2</sup>) 표현이 가능 하다.</p>
	</body>
</html>
