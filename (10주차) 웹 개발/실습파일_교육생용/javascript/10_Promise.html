        <h3>*Promise</h3>
        <p>비동기 프로그래밍은 순서에 상관없이 진행되지 않는다.</p>
        <p>때문에 A 를 처리 하고 난 내용을 받아서 B 가 처리할 경우 문제가 발생한다.</p>
        <p>비동기 처리의 문제점이고 이를 위해 java 에서는 blocking 을 사용 했다.</p>
        <p>javascript 에서도 callback 이라는 것을 제공 하지만 구현이 쉽지 않다.</p>
        <p>특히나 단계가 많은 프로그래밍 일 경우 콜랙에 콜백에 콜백... 을 부르는 경우가 생겨 난다.</p>
    </body>
    <script>


        const ansyncEx = ()=>{
            let result = 0;
            setTimeout(()=>{
                result = 10+20;//이 계산 과정이 0.1초 걸린다 가정하면...
                console.log('10+20 ? '+result);
                //return 'result : '+result; // 안타깝게도 이 안에서는 return 이 불가능 하다!
            },100);
            //끝날때 까지 기다리게 할 수가 없다.
            return'result : '+result;//기다리지 않고 출력해 버린다.
        };
        console.log(ansyncEx());//비동기 처리시 문제점


        //Promise 를 사용 하면 해결 할 수 있다.
        const prom = ()=>{
            return new Promise((resolve,reject)=>{
                let result = 0;
                setTimeout(()=>{
                    result = 10+20;                    
                    resolve('result : '+result);//resolve : 성공, reject : 실패
                },100);                
            });
        }
        console.log(prom());//단, Promise 라는 객체로 반환하게 된다.

        /* Prom() 함수로 부터 추출된 값을 추출 하여 콘솔로 출력하기 위한 코드를 작성 하시오 */

    </script>
