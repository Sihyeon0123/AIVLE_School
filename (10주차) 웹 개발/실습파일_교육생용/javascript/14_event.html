    <!--onload : html 문서가 다 읽히면 일어나는 이벤트-->
    <body onload="alert('loading 끝')">
        <!-- 한 요소에 여러 이벤트를 추가할 수도 있다. -->
        <div onmouseover="mouseEvt('over')" onmouseout="mouseEvt('out')"></div>
        <br/>
        <!-- inline 속성을 갖은 div : 특정 문자열을 지정할때 사용-->
        <h3>오늘의 날짜 : <span id="demo"></span></h3>
        <input type="button" onclick="getDay()" value="날짜 추출"/>
        <br/>
        <input type="text" onkeydown="going(event)" value=""/>
        <input type="text" onkeyup="typing(event)"/>
        <h4 id="typing"></h4>
        <select onchange="selectOne(this)">
            <option value="Audi">Audi</option>
            <option value="BMW">BMW</option>
            <option value="Benz">Benz</option>
            <option value="Volvo">Volvo</option>
        </select>
	</body>
    <script>
		//어떤 이벤트가 가능한지 궁금한가?
        let elem = document.querySelector("body");
		//on 으로 시작하는 속성은 모두 가능한 이벤트
		console.log(elem);//onload 를 보면 우리가 만든함수가 등록되어 있음을 알 수 있다.

		function mouseEvt(arg){ // 함수에서 무언가를 주면 매개변수로 받을 수 있다.
            console.log('mouse '+arg);
            let elem = document.querySelector('div');            
            elem.innerHTML = 'mouse '+arg;
        }

		function getDay(){
            console.log(Date());
            document.querySelector("#demo").innerHTML = Date();
        }

		function going(evt){
            console.log(evt); /* 이 안에 담긴 객체의 내용이 무엇을 의미하는지 주석으로 추가해 보자*/
            console.log(evt.target); /* 이 안에 담긴 객체의 내용이 무엇을 의미하는지 주석으로 추가해 보자*/
            let msg = evt.target.value;            
            console.log(msg);// 한박자씩 늦는다?
            document.querySelector("#typing").innerHTML = msg;
        }

        function typing(evt){
            document.querySelector("#typing").innerHTML = evt.target.value; ;
        }

		//change 는 요소안의 값 변화가 일어날때 발동 된다.
		function selectOne(elem){
            let sel = elem.value; /* 이 안에 담긴 객체의 내용이 무엇을 의미하는지 주석으로 추가해 보자*/
            document.querySelector("#typing").innerHTML = sel;
        }
    </script>
