    <script>    
        //1. 비동기 방식의 문제점
        /* plus(5) 실행시 답이 0이 나오는 이유를 주석으로 추가해 보자*/
        function plus(a){
            let result = 0;
            setTimeout(function(){
                result = a+10;
            },100);
            console.log(result);
        }

        //plus(5) 를 구하시오
        plus(5);    
        
		
		// 2. 그래서 특정 내용이 끝나고 그 다음 실행하는 콜백 함수를 사용 한다.
        function plus_call(a,onResult){//계산할 값, callBack(다 끝나고 얘 실행 해)   
            setTimeout(function(){
                onResult(a+10);
            },100);
        }
        
        // 3. 5가 들어가고 난 후에 무언가(console 로 받은값 찍기)를 한다.        
        plus_call(5,function(result){
            console.log("답 : "+result);//callBack 에서 리턴은 안된다.
		});

        /* 위 내용을 화살표 함수로 축약해 보자 */



    </script>
