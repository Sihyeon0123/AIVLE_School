    <script>
        // 오브젝트 만드는 법 1 - 초기에 값을 넣고 생성
		const car = {type:"Fiat", model:500, color:"white"};
		console.log(car);
				
		// 오브젝트 만드는 법 2		
		const person = {};
		
		// 오브젝트 만드는 법 3
		let computer = new Object();
		
		// 값 추가 하는 법 1 -> const 로 상수를 선언해도 Object 는 일부 수정이나 추가, 삭제는 가능하다.
		/* 교안에 나오는 console 처럼 출력할 수 있도록 person 객체에 키와 값을 채워 보자 */		
		console.log(person);
				
		// 값 추가 하는 법 2 - 오브젝트는 인덱스가 문자열인 배열이다?		
		computer = {};
		/* 교안에 나오는 console 처럼 출력할 수 있도록 computer 객체에 키와 값을 채워 보자 */
		console.log(computer);

		// 오브젝트 안에는 무엇이든지 들어간다.
		person.work = function(){
			console.log('일을 한다.');
		};
		console.log(person);

		// 앞에서 배웠지만 변수안에도 무엇이든지 들어간다.
		const test = function(){
			console.log('변수안에 함수가 들어가?');
		}

		// 사용법 객체와 객체에서 사용할 내용을 불러온다.
		console.log(person.name);
		person.work();
		console.log(computer.cpu);//자동완성 지원 안됨
		console.log(computer['ram']);// 당연히 이런 형태로도 불러 올 수 있다.
		test();
		
		// Object 의 값 하나씩 빼내기
        let knv = Object.entries(person);
        console.log(knv); // key 와 value 를 배열에 담아 2차원 형태로 제공

        let keys = Object.keys(person);
        console.log(keys);//object 의 key 만 모아 배열에 담아전달 한다.

        let values = Object.values(person);
        console.log(values);//object 의 value 만 모아 배열에 담아전달 한다.
		
		
    </script>
