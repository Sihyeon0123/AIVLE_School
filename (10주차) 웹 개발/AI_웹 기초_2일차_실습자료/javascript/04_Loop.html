<html>

        <meta charset="UTF-8">

    <body>
        <h3>* The For/Of Loop</h3>
        <p>for of 는 기존의 forEach 와 비슷한 역활을 한다.</p>
        <p>for of 는 Array, String  등 다양한 자료구조에서 데이터를 뺄 수 있다.</p>
        <p>그리고 진행 도중 break 사용이 가능 하다.</p>
    </body>
    <script>
        let array = [1,2,3,4,5];
        let string = "forEach 와 for of 의 차이";

        // 1. 일반 for
        for(let i=0;i<array.length;i++){
            console.log(i);            
        }


        /*아래 코드의 문제점을 수정하시오*/
        // 2.forEach        
        array.forEach(function(item,idx){
            //console.log(item);
            //if(item==3){//break 안됨
            //    break;
            //}
        });        
       
        /* 꺼내온 값이 3 일경우 반복문이 멈추는 코드를 작성하시오 */
        //3. for of
        for (let item of array) {
            if(item==3){//break 안됨
                break;
            }
            console.log(item);
        }

    </script>
