<!DOCTYPE html>
<html>
<head>
	<title>col span example</title>
	<style>
	table, th, td {
		border: 1px solid black;
		border-collapse: collapse;
	}
	th, td {
		padding: 5px;
		text-align: center;    
	}
	</style>
</head>
<body>
	<table>
	  <caption>colspan="7"</caption>
		<tr>
			<th>9월 4주차</th>
		</tr>
		<tr>
			<td>21</td>
		</tr>
	</table>

    <table>
        <caption>rowspan="7"</caption>
          <tr>
              <th>주차</th>
              <th>날짜</th>
          </tr>
          <tr>
              <td>4</td>
              <td>21</td>
          </tr>
      </table>

</body>
</html>
