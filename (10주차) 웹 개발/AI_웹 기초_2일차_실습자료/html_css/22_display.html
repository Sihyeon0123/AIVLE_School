<!--HTML 시작-->
<html>
    <!--머릿말-->
	<head>
        <link rel="icon" href="../img/favicon.png">
		<meta charset="utf-8">
		<title>Page Title</title>
        <!--style 을 여기에 명시 한다.-->
        <style>
            input{
				/*display 속성을 아래 값들로 적용해 보자*/
                /*none|inline|block*/
            } 
			div{
				width: 50px;
				height: 25px;
				border: 3px solid yellowgreen;
				margin: 5px;
				float:left;
			}     
      
            /*특정 요소는 float:left 영향을 받고 싶지 않을 수 있다.*/
            div.first{
				border: 3px solid red;
				/*빨간 테두리 박스가 줄바꿈 되도록 스타일을 추가해 보자*/
			}
        </style>
	</head>
    <!--본문-->
	<body>
        <!--inline : 좌에서 우로 정렬 시킨다.-->
        <input type="text"/>
        <input type="text"/>
        <input type="text"/>
        <input type="text"/>
        <!--block : 위에서 아래로-->
		<div></div>
		<div></div>
		<div></div>
		
		<div class="first"></div>
		<div></div>
		<div></div>
		
		<div class="first"></div>
		<div></div>
		<div></div>
	</body>
</html>
