<html>
    <head>
        <meta charset="utf-8">
        <title>Login Page</title>
        <link rel="icon" href="../img/favicon.png">
        <style>

        </style>
    </head>
    <body>
        <h2>로그인 페이지</h2>
        <hr/>
        <form action="" method="get">
            <table>
                <tr>
                    <th>ID</th>
                    <td>
                        <input type="text" name="uesrId" value="" placeholder="아이디를 입력 하세요"/>
                    </td>
                    <td rowspan="2">
                        <input type="submit" value="로그인"/>
                    </td>
                </tr>
                <tr>
                    <th>PW</th>
                    <td>
                        <input type="password" name="uesrPw" value="" placeholder="비밀번호를 입력 하세요"/>
                    </td>
                </tr>
                <tr>                
                    <td colspan="3">
                        <input type="button" value="회원가입"/>
                        <input type="button" value="아이디/비번 찾기"/>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
