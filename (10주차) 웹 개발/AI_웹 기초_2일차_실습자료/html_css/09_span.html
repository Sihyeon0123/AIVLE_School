<!DOCTYPE html>
<html>
<head>
	<title>col span example</title>
	<style>
	table, th, td {
		border: 1px solid black;
		border-collapse: collapse;
	}
	th, td {
		padding: 5px;
		text-align: center;    
	}
	</style>
</head>
<body>
    <table style="width:300px">
        <caption>rowspan=2</caption>
        <tr>
            <td>TD</td><td>TD</td><td>TD</td>
        </tr>
        <!--교안의 표 모양처럼 만들기 위한 태그를 채우세요-->
    </table>
    <hr/>
    <table style="width:300px">
        <caption>colspan=2</caption>
        <tr>
            <td>TD</td><td>TD</td><td>TD</td>
        </tr>
        <!--교안의 표 모양처럼 만들기 위한 태그를 채우세요-->
    </table>
</body>
</html>
