<html>
    <head>
        <meta charset="UTF-8">
        <title>ECMA SCRIPT</title>
    </head>
    <body>

    </body>
    <script>    
		/*
		비동기 방식은 특정한 내용이 실행 후 다른 내용을 실행하는 순차 진행 상황에서 문제를 발생 시킨다.
		이런 문제 해결을 위해서 콜백(callback), 즉 일 처리가 끝나면 실행하는 함수이다.
		*/
	    /*click 이라는게 들어가면 그뒤에 무언가를 한다.
        document.addEventListener("click",function(e){
            console.log("e : ",e);
        });
        */
		
		// 콜백함수는 왜 사용 하는가?

        //1. 비동기 방식의 문제점
        function plus(a){
            let result = 0;
            setTimeout(function(){
                result = a+10;
                //return result;//undefined
            },100);
            console.log(result);
        }

        //plus(5) 를 구하시오
        plus(5);    
        
		
		// 2. 그래서 특정 내용이 끝나고 그 다음 실행하는 콜백 함수를 사용 한다.
        function plus_call(a,onResult){//계산할 값, callBack(다 끝나고 얘 실행 해)
        setTimeout(function(){
            onResult(a+10);
        },100);
        }
        
        // 3. 5가 들어가고 난 후에 무언가(console 로 받은값 찍기)를 한다.
        /*
        plus_call(5,function(result){
            console.log("답 : "+result);//callBack 에서 리턴은 안먹힌다.
		});
        */
        plus_call(5,result => console.log("답 : "+result));

    </script>
</html>
