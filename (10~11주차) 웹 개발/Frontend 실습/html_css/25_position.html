    <!--머릿말-->
	<head>
        <link rel="icon" href="../img/favicon.png">
		<meta charset="utf-8">
		<title>Page Title</title>
        <!--style 을 여기에 명시 한다.-->
        <style>
        div{
            width: 200px;
            height: 200px;
            text-align: center;
        }
        div.static{
            position: static;
            background-color: yellow;            
        }

        /*교안의 예시 화면 처럼 나타날 수 있도록 position 속성을 추가해 보자*/
        div.relative{
            background-color: aqua;
            top:1000px;/*static 의 하단 에서 부터 움직임*/
            left: 200px;/*top 의 좌측 에서 부터 움직임*/
        }
        div.absolute{
            width: 100px;
            height: 100px;
            border: 3px solid red;
            left: 50%;
            top: 50%;
        }
        div.fixed{
            background-color: coral;
            top: 10%;
            right:1%;
        }
        </style>
